name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/CanYourPCRunIt-Scanner.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CanYourPCRunIt-Scanner.exe" | Out-File dist/checksums.txt -Encoding ascii

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/CanYourPCRunIt-Scanner.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CanYourPCRunIt-Scanner.exe
            dist/checksums.txt
          generate_release_notes: true
